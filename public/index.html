<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Website</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="scroll-container" class="locked">
        <section class="page" id="page-1">
            <header class="header">
                <a href="#" class="glass-btn">Privacy Policy</a>
            </header>
            <main class="main-content">
                <button id="see-library-btn" class="glass-btn main-action-btn">Open</button>
                
                <div id="animation-container">
                    <div id="video-wrapper">
                        <video id="animation-video" src="bg-video.mp4" muted playsinline></video>
                        <div id="watermark-cover">
                            <img src="bird.png" alt="Cover" class="bird-cover">
                        </div>
                        <div id="library-decorations" class="hidden">
                            <div class="floating-book book1">📚</div>
                            <div class="floating-book book2">📖</div>
                            <div class="floating-book book3">🎓</div>
                            <div class="floating-book book4">✒️</div>
                            <div class="scroll-hint">
                                <span>Scroll Down</span>
                                <div class="arrow-down"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </section>
        
        <section class="page" id="page-2">
            <div id="library-container">
                <h2 class="library-title">The Grand Library</h2>
                
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Search 10,000+ Hindi, NCERT & Classic Books...">
                    <button id="search-btn" class="glass-btn">Search</button>
                </div>
                
                <div id="loading-spinner" class="hidden">Searching...</div>

                <div class="bookshelf" id="bookshelf">
                    <!-- Books generated by JS -->
                </div>

                <div class="pagination-container hidden" id="pagination">
                    <button id="prev-btn" class="glass-btn">Previous</button>
                    <span id="page-info">Page 1</span>
                    <button id="next-btn" class="glass-btn">Next</button>
                </div>
            </div>
        </section>
    </div>

    <!-- Modal for reading book over Page 1 -->
    <div id="book-modal" class="hidden-modal">
        <div class="modal-header">
            <button id="close-modal-btn" class="glass-btn close-btn">Close Book</button>
        </div>
        <iframe id="book-iframe" src="" frameborder="0"></iframe>
    </div>

    <script src="books.js"></script>
    <script src="script.js"></script>
</body>
</html>
